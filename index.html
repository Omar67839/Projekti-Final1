<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exotic Garage & Expense Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>🏎️ Exotic Garage Expense Manager</h1>
            <p>Track builds, maintenance, fuel, and upkeep costs across your garage.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Garage Investment</h3>
                <p class="stat-value" id="total-amount">$0</p>
            </div>
            <div class="stat-card">
                <h3>Total Logged Records</h3>
                <p class="stat-value" id="total-count">0</p>
            </div>
            <div class="stat-card">
                <button id="export-btn" class="btn-export">📥 Export Report (CSV)</button>
            </div>
        </div>

        <!-- Garage Manager Section -->
        <div class="chart-section" style="padding: 15px;">
            <h2>Manage Garage Vehicles</h2>
            <form id="car-form" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="new-car-name" placeholder="New Car Name (e.g., Porsche GT3RS)" required style="flex: 1; padding: 10px; background: #252525; border: 1px solid #444; color: white; border-radius: 4px;">
                <button type="submit" class="btn-primary" style="width: 150px;">Add Car</button>
            </form>
            <div id="car-list" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
        </div>

        <div class="chart-section">
            <h2>Spending Breakdown by Category</h2>
            <div class="chart-wrapper">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="controls-section">
            <input type="text" id="search-input" placeholder="Search expenses...">
            <select id="filter-car">
                <option value="All">All Vehicles</option>
            </select>
            <select id="filter-category">
                <option value="All">All Categories</option>
                <option value="Fuel">Fuel</option>
                <option value="Mods">Mods & Tuning</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Insurance">Insurance</option>
            </select>
        </div>

        <div class="main-content">
            <div class="form-container">
                <h2>Add New Expense</h2>
                <form id="expense-form">
                    <div class="input-group">
                        <label>Select Vehicle</label>
                        <select id="car" required>
                            <option value="">Select Car</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Title / Item</label>
                        <input type="text" id="title" placeholder="e.g., Titanium Exhaust" required>
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Mods">Mods & Tuning</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Insurance">Insurance</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Cost ($)</label>
                        <input type="number" id="amount" placeholder="2500" required>
                    </div>
                    <div class="input-group">
                        <label>Mileage (Odometer)</label>
                        <input type="text" id="mileage" placeholder="e.g., 12,600 mi">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn-primary">Add Record</button>
                </form>
            </div>

            <div class="table-container">
                <h2>Expense Records</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Cost</th>
                            <th>Mileage</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/expenses';
        const CARS_URL = '/api/cars';

        const expenseTableBody = document.getElementById('expense-table-body');
        const totalAmountEl = document.getElementById('total-amount');
        const totalCountEl = document.getElementById('total-count');
        const expenseForm = document.getElementById('expense-form');
        const carForm = document.getElementById('car-form');
        const newCarNameInput = document.getElementById('new-car-name');
        const carListEl = document.getElementById('car-list');
        const searchInput = document.getElementById('search-input');
        const filterCar = document.getElementById('filter-car');
        const filterCategory = document.getElementById('filter-category');
        const carSelect = document.getElementById('car');
        const exportBtn = document.getElementById('export-btn');

        let currentExpenses = [];
        let myChart = null;

        // Fetch and populate cars in dropdowns and manager list
        async function fetchCars() {
            const res = await fetch(CARS_URL);
            const cars = await res.json();

            // Clear & populate select dropdowns
            carSelect.innerHTML = '<option value="">Select Car</option>';
            filterCar.innerHTML = '<option value="All">All Vehicles</option>';
            carListEl.innerHTML = '';

            cars.forEach(car => {
                carSelect.innerHTML += `<option value="${car}">${car}</option>`;
                filterCar.innerHTML += `<option value="${car}">${car}</option>`;
                
                carListEl.innerHTML += `
                    <span style="background: #252525; padding: 6px 12px; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                        🚗 ${car} 
                        <button onclick="deleteCar('${car}')" style="background: #440000; color: #ff6b6b; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer;">×</button>
                    </span>
                `;
            });
        }

        async function deleteCar(carName) {
            if(!confirm(`Are you sure you want to delete ${carName}?`)) return;
            await fetch(`${CARS_URL}/${encodeURIComponent(carName)}`, { method: 'DELETE' });
            fetchCars();
            fetchExpenses();
        }

        carForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = newCarNameInput.value.trim();
            if(!name) return;

            const res = await fetch(CARS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });

            if(res.ok) {
                newCarNameInput.value = '';
                fetchCars();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        });

        function renderChart(categoryTotals) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const data = {
                labels: Object.keys(categoryTotals),
                datasets: [{
                    data: Object.values(categoryTotals),
                    backgroundColor: ['#ffb703', '#00b4d8', '#ff4d4d', '#9d4edd'],
                    borderWidth: 0
                }]
            };

            if (myChart) {
                myChart.data = data;
                myChart.update();
            } else {
                myChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#ffffff' } } }
                    }
                });
            }
        }

        async function fetchExpenses() {
            const search = searchInput.value;
            const car = filterCar.value;
            const category = filterCategory.value;

            const query = new URLSearchParams();
            if (search) query.append('search', search);
            if (car) query.append('car', car);
            if (category) query.append('category', category);

            const res = await fetch(`${API_URL}?${query.toString()}`);
            const data = await res.json();

            currentExpenses = data.expenses;
            totalAmountEl.textContent = `$${data.totalSpent.toLocaleString()}`;
            totalCountEl.textContent = data.totalItems;

            renderChart(data.categoryTotals);

            expenseTableBody.innerHTML = '';
            if (data.expenses.length === 0) {
                expenseTableBody.innerHTML = `<tr><td colspan="7" class="no-data">No records found.</td></tr>`;
                return;
            }

            data.expenses.forEach(exp => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${exp.car}</strong></td>
                    <td>${exp.title}</td>
                    <td><span class="badge ${exp.category.toLowerCase()}">${exp.category}</span></td>
                    <td>$${Number(exp.amount).toLocaleString()}</td>
                    <td>${exp.mileage}</td>
                    <td>${exp.date}</td>
                    <td><button onclick="deleteExpense(${exp.id})" class="btn-delete">Delete</button></td>
                `;
                expenseTableBody.appendChild(tr);
            });
        }

        expenseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newExpense = {
                car: document.getElementById('car').value,
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value,
                mileage: document.getElementById('mileage').value,
                date: document.getElementById('date').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newExpense)
            });

            expenseForm.reset();
            fetchExpenses();
        });

        async function deleteExpense(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchExpenses();
        }

        exportBtn.addEventListener('click', () => {
            if (currentExpenses.length === 0) return alert('No data to export!');
            let csv = 'Vehicle,Title,Category,Cost,Mileage,Date\n';
            currentExpenses.forEach(exp => {
                csv += `"${exp.car}","${exp.title}","${exp.category}",${exp.amount},"${exp.mileage}","${exp.date}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'garage_expenses.csv';
            a.click();
        });

        searchInput.addEventListener('input', fetchExpenses);
        filterCar.addEventListener('change', fetchExpenses);
        filterCategory.addEventListener('change', fetchExpenses);

        // Initial Load
        fetchCars();
        fetchExpenses();
    </script>
</body>
</html>
